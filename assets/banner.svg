<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background linear gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1f1538" />
    </linearGradient>

    <!-- Glowing accents -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
    </pattern>

    <!-- Subtle glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 42px;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }
      .sub-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 19px;
        fill: #94a3b8;
      }
      .tag-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #38bdf8;
      }
      .flow-path {
        stroke-dasharray: 8, 8;
        animation: flowDash 30s linear infinite;
      }
      .pulse-node {
        animation: pulseScale 3s ease-in-out infinite alternate;
      }
      .float-pill-1 {
        animation: floatA 6s ease-in-out infinite alternate;
      }
      .float-pill-2 {
        animation: floatB 7s ease-in-out infinite alternate;
      }
      .float-pill-3 {
        animation: floatC 5s ease-in-out infinite alternate;
      }
      @keyframes flowDash {
        to {
          stroke-dashoffset: -1000;
        }
      }
      @keyframes pulseScale {
        0% { transform: scale(0.96); opacity: 0.7; }
        100% { transform: scale(1.04); opacity: 1; }
      }
      @keyframes floatA {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-10px); }
      }
      @keyframes floatB {
        0% { transform: translateY(0px); }
        100% { transform: translateY(12px); }
      }
      @keyframes floatC {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Decorative Circuit / Flow Lines (Background Layer) -->
  <g opacity="0.35">
    <path class="flow-path" d="M 0 100 Q 300 40 600 120 T 1200 80" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="flow-path" d="M 0 280 Q 400 320 800 240 T 1200 290" fill="none" stroke="#818cf8" stroke-width="2" />
    <circle cx="200" cy="85" r="4" fill="#38bdf8" />
    <circle cx="580" cy="116" r="4" fill="#818cf8" />
    <circle cx="950" cy="98" r="4" fill="#c084fc" />
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="70" r="140" fill="#38bdf8" opacity="0.12" filter="url(#glow)" />
  <circle cx="1020" cy="270" r="160" fill="#8b5cf6" opacity="0.12" filter="url(#glow)" />
  <circle cx="600" cy="180" r="180" fill="#3b82f6" opacity="0.08" filter="url(#glow)" />

  <!-- Animated Floating Feature Pills (Soft Background/Midground Accent) -->
  <g class="float-pill-1" transform="translate(850, 45)" opacity="0.85">
    <rect width="180" height="36" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
    <circle cx="18" cy="18" r="5" fill="#38bdf8" />
    <text x="32" y="23" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">BPMN 2.0 &amp; DMN 1.3</text>
  </g>

  <g class="float-pill-2" transform="translate(920, 105)" opacity="0.85">
    <rect width="195" height="36" rx="18" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" opacity="0.9" />
    <circle cx="18" cy="18" r="5" fill="#818cf8" />
    <text x="32" y="23" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">Workflow Orchestration</text>
  </g>

  <g class="float-pill-3" transform="translate(870, 165)" opacity="0.85">
    <rect width="170" height="36" rx="18" fill="#1e293b" stroke="#c084fc" stroke-width="1.2" opacity="0.9" />
    <circle cx="18" cy="18" r="5" fill="#c084fc" />
    <text x="32" y="23" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">Decision Engines</text>
  </g>

  <!-- Foreground Content: Header Tag, Title, Subtitle, and Metric Badges -->
  <g transform="translate(80, 0)">
    <!-- Top Pill Tag -->
    <g transform="translate(0, 68)">
      <rect width="260" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <circle cx="16" cy="15" r="4" fill="#38bdf8" />
      <text x="28" y="20" class="tag-text">⚡ ENTERPRISE AUTOMATION &amp; LOGIC</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="148" class="title-text">Service Automation &amp;</text>
    <text x="0" y="196" class="title-text" fill="url(#primaryGrad)">Business Rules Engine</text>

    <!-- Subtitle -->
    <text x="0" y="242" class="sub-text">Curated SaaS Platforms, BRMS Frameworks &amp; Open-Source Workflow Engines</text>

    <!-- Metrics / Badges bar -->
    <g transform="translate(0, 274)">
      <!-- Pill 1 -->
      <rect width="130" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="14" y="21" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">💼 SaaS Titans</text>

      <!-- Pill 2 -->
      <rect x="142" width="165" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="156" y="21" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">⚙️ Open-Source Engines</text>

      <!-- Pill 3 -->
      <rect x="319" width="160" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="333" y="21" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">📊 Market Dynamics</text>
    </g>
  </g>
</svg>
